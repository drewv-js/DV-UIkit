name: Publish Private Package

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: Force publish even if changed-package detection says root package is unchanged
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:lockstep
      - id: changed
        run: npm run release:changed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run release:dry-run
      - run: npm run test:apps-smoke
      - run: npm publish --ignore-scripts
        if: steps.changed.outputs.should_publish_root == 'true' || github.event.inputs.force_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Skip publish (no root package changes)
        if: steps.changed.outputs.should_publish_root != 'true' && github.event.inputs.force_publish != 'true'
        run: echo "No root package changes detected. Skipping publish."
