name: Publish Private Package

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: Force publish even if changed-package detection says root package is unchanged
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:lockstep
      - id: changed
        run: pnpm run release:changed
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run release:dry-run
      - run: pnpm run test:apps-smoke
      - run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com
        if: steps.changed.outputs.should_publish_root == 'true' || github.event.inputs.force_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip publish (no root package changes)
        if: steps.changed.outputs.should_publish_root != 'true' && github.event.inputs.force_publish != 'true'
        run: echo "No root package changes detected. Skipping publish."
